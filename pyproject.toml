# pyproject.toml
#
# Central configuration for sufler's quality toolchain.
# One source of truth for black, isort, ruff, mypy, pytest, coverage, bandit.
# (pylint keeps its own .pylintrc; project metadata/deps stay in requirements*.txt.)

[tool.black]
line-length = 120
target-version = ["py311", "py312"]
extend-exclude = '''/(\.venv|media|tmp)/'''

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["**/media/**", "**/tmp/**", "**/.venv/**"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "media", "tmp"]

[tool.ruff.lint]
# Conservative, correctness-focused set. UP/SIM/I are intentionally left off so
# ruff never rewrites existing typing/imports under us — black + isort + pylint
# already own formatting and import order.
select = ["E", "F", "W", "B", "C4"]
# E203 conflicts with black; E501 (line length) is owned by black + pylint.
ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["F401", "F841", "E402", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src", "main.py"]
exclude = '(^tests/|^media/|^tmp/|^\.venv/)'
ignore_missing_imports = true        # PyQt6/sounddevice/pynput/mss ship no stubs
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src", "main.py"]
branch = true
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", "media", "tmp", ".venv"]
skips = ["B101"]   # asserts are allowed in dev/test code
